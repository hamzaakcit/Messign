name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Type-check & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check client
        working-directory: client
        run: npx tsc --noEmit

      - name: Type-check server
        working-directory: server
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
        env:
          # Scratch database for the engage tenancy tests (they create and drop their own rows).
          ENGAGE_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

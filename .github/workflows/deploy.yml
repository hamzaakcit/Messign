# Triggers production hosting after merge to `main`.
# - Vercel: set GitHub secret VERCEL_DEPLOY_HOOK (Deploy Hook URL from Vercel project → Settings → Git → Deploy Hooks).
# - Railway: prefer connecting the repo in Railway (auto-deploy on push). Optional: RAILWAY_DEPLOY_HOOK if you use a webhook instead.
name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel (frontend)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not set — skipping Vercel trigger. Add the secret in repo Settings → Secrets and variables → Actions."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Vercel deploy hook invoked."

      - name: Trigger Railway (optional webhook)
        env:
          HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RAILWAY_DEPLOY_HOOK is not set — skipping. If the API deploys via Railway’s GitHub integration, no webhook is needed."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Railway deploy hook invoked."

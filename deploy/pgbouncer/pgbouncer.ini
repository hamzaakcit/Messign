; PgBouncer config for Messign — Transaction pooling (RLS-compatible)
; Copy to /etc/pgbouncer/pgbouncer.ini on your server, or use with Railway PgBouncer plugin

[databases]
; Format: alias = host=HOST port=PORT dbname=DBNAME
; For local: PostgreSQL on 5432, PgBouncer will connect to it
messign = host=127.0.0.1 port=5432 dbname=messign_production

; For Docker/remote: use your PostgreSQL host
; messign = host=postgres port=5432 dbname=messign_production

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; CRITICAL: Use "transaction" mode for RLS compatibility
; - "session" mode would also work but wastes connections
; - "statement" mode breaks SET LOCAL / set_config (required for RLS tenant context)
pool_mode = transaction

; Pool sizing
default_pool_size = 25          ; connections per user/database pair
max_client_conn = 200           ; max frontend connections from your app
reserve_pool_size = 5           ; extra connections for burst
reserve_pool_timeout = 3        ; seconds before using reserve

; Timeouts
server_idle_timeout = 300
client_idle_timeout = 600

; Transaction mode resets session state between transactions.
; Our RLS uses set_config('app.current_tenant', $1, true) inside each transaction,
; so it's safe — the setting is scoped to the transaction and doesn't leak across clients.
